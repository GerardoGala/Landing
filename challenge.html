<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layline | San Juan Academy</title>

  <!-- 1. External Framework First (Loaded from fast global CDN servers) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <link rel="stylesheet" href="css/practice.css">
  
  <!-- 3. External Brand CSS Framework First -->
  <link rel="stylesheet" href="https://gerardogala.github.io/SanJuanAcademy/css/brand.css">

  <!-- 4. Your Personal Custom CSS Last (Overrides everything above safely) -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="manifest" href="favicon/site.webmanifest">
  <meta name="viewport" content="width=device-width, initial-scale=.5, user-scalable=no">
</head>
<body>

    <!-- Shared Header Injection -->
    <div id="header-placeholder"></div>

    <!-- Main Workspace -->
    <div class="container my-5">
        <!-- Replaced with .brand-card utility from your shared.css -->
        <div class="brand-card" id="game-card">
            
            <div class="header-meta">
                <h3 class="scenario-title" id="title-field">Challenge Mode</h3>
                <span class="step-counter" id="step-field">1 / 3</span>
            </div>

            <div class="instructions" id="text-field">Deducing environmental conditions...</div>

            <!-- Items Deck Bin -->
            <div class="source-box" id="source-container">
                <div class="item" draggable="true" id="ilca">⛵</div>
                <div class="item" draggable="true" id="wind">💨</div>
                <div class="item" draggable="true" id="sailor">🧍</div>
            </div>

            <!-- Placement Arena Grid -->
            <div class="work-area" id="work-area">
                <div class="slot" id="slot1">Slot 1</div>
                <div class="slot" id="slot2">Slot 2</div>
                <div class="slot" id="slot3">Slot 3</div>
                <div class="beach-fixed" id="beach-element">🏖️</div>
            </div>

            <!-- Control Actions Rack (Updated function bindings for assessment logic) -->
            <div class="action-bar">
                <div id="result"></div>
                <div class="btn-group gap-2">
                    <button class="btn btn-primary" id="btn-submit" onclick="submitChallengeAnswer()">Submit Answer</button>
                    <button class="btn btn-secondary text-white" id="btn-retry" style="display:none;" onclick="resetChallengeStage()">Try Again</button>
                    <button class="btn btn-primary" id="btn-next" style="display:none;" onclick="nextChallengeStage()">Continue Challenge →</button>
                </div>
            </div>

            <!-- Bottom Navigation Context -->
            <div class="text-center mt-5 pt-4 border-top">
                <a href="index.html" class="btn btn-outline-primary me-3">
                    <i class="bi bi-house-door me-2"></i>Home
                </a>
                <a href="practice.html" class="btn btn-primary">
                    Back to Practice <i class="bi bi-arrow-left ms-2"></i>
                </a>
            </div>

        </div>
    </div>

    <!-- Shared Footer Injection -->
    <div id="footer-placeholder"></div>

    <!-- Script Orchestration Core -->
    <script src="js/layout.js"></script>
    <script src="js/challenge.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Launching & Landing | San Juan Academy</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


    <!-- Shared CSS -->

    <link
        rel="stylesheet"
        href="https://gerardogala.github.io/Tutorial-Shared/shared.css">


    <!-- Landing CSS -->

    <link
        rel="stylesheet"
        href="css/style.css">


    <!-- Favicon -->

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="favicon/apple-touch-icon.png">

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="favicon/favicon-32x32.png">

    <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="favicon/favicon-16x16.png">

    <link
        rel="manifest"
        href="favicon/site.webmanifest">

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div id="header-placeholder"></div>



    <!-- =====================================================
         LEARN
    ====================================================== -->

    <main class="container text-center py-2">


        <!-- Scenario Title -->

        <h1
            id="scenarioTitle"
            class="h3 fw-bold mb-1">

            Onshore Wind

        </h1>


        <!-- Scenario Counter -->

        <p
            id="scenarioCounter"
            class="text-muted mb-3">

            Scenario 1 of 4

        </p>



        <!-- =================================================
             SVG CONTENT HOLDER

             learn.js will load the appropriate SVG here.
        ================================================== -->

        <div
            id="scenarioContainer"
            class="mx-auto"
            style="max-width: 600px;">

        </div>



        <!-- =================================================
             SCENARIO DESCRIPTION
        ================================================== -->

        <section
            id="scenarioDescription"
            class="mx-auto mt-3"
            style="max-width: 600px;">

            <p
                id="scenarioText"
                class="lead">

                The wind is blowing toward the beach.

            </p>

        </section>



        <!-- =================================================
             NAVIGATION
        ================================================== -->

        <div
            class="d-flex justify-content-between align-items-center gap-2 mt-3"
            style="max-width: 600px; margin-left:auto; margin-right:auto;">


            <!-- Main Menu -->

            <a
                href="index.html"
                class="btn btn-outline-primary">

                <i class="bi bi-house"></i>

                Main Menu

            </a>


            <!-- Previous -->

            <button
                id="previousButton"
                type="button"
                class="btn btn-primary">

                <i class="bi bi-arrow-left"></i>

                Previous

            </button>


            <!-- Next -->

            <button
                id="nextButton"
                type="button"
                class="btn btn-primary">

                Next

                <i class="bi bi-arrow-right"></i>

            </button>

        </div>


    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div id="footer-placeholder"></div>



    <!-- =====================================================
         SHARED LAYOUT
    ====================================================== -->

    <script src="js/layout.js"></script>



    <!-- =====================================================
         ANIME.JS
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js">
    </script>



    <!-- =====================================================
         LEARN LOGIC
    ====================================================== -->

    <script src="js/learn.js"></script>


</body>

</html>

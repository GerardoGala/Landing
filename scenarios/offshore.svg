```svg
<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 800 500"
    width="100%">

    <!--
        OFFSHORE WIND

        WIND TRAVELS RIGHT → LEFT

        UNIVERSAL RULE:
        WIND → SAILOR → ILCA

        Therefore the physical layout is:

        LEFT → RIGHT:
        ILCA → SAILOR → WIND → BEACH
    -->

    <!-- WATER -->
    <rect
        x="0"
        y="0"
        width="800"
        height="500"
        fill="#dff3ff" />

    <!-- BEACH -->
    <path
        id="beach"
        d="
            M650 0
            L800 0
            L800 500
            L650 500
            Z
        "
        fill="#f4ead7" />

    <text
        x="725"
        y="70"
        text-anchor="middle"
        font-size="22"
        font-weight="700"
        fill="#795548">
        BEACH
    </text>

    <!-- WIND -->
    <g id="wind">

        <text
            x="570"
            y="55"
            text-anchor="middle"
            font-size="22"
            font-weight="700"
            fill="#0d6efd">
            WIND
        </text>

        <!-- RIGHT → LEFT -->
        <line
            x1="635"
            y1="100"
            x2="500"
            y2="100"
            stroke="#0d6efd"
            stroke-width="7"
            stroke-linecap="round" />

        <polygon
            points="505,82 475,100 505,118"
            fill="#0d6efd" />

        <line
            x1="635"
            y1="150"
            x2="500"
            y2="150"
            stroke="#0d6efd"
            stroke-width="7"
            stroke-linecap="round" />

        <polygon
            points="505,132 475,150 505,168"
            fill="#0d6efd" />

    </g>

    <!-- ILCA -->
    <g id="ilca">

        <!-- HULL -->
        <path
            id="boatHull"
            d="
                M100 310
                Q135 290 195 295
                L360 295
                Q410 295 435 315
                Q410 345 360 350
                L195 350
                Q135 350 100 330
                Z
            "
            fill="#ffffff"
            stroke="#222"
            stroke-width="4" />

        <!-- BOW -->
        <path
            d="
                M410 300
                Q450 315 410 345
            "
            fill="none"
            stroke="#222"
            stroke-width="4" />

        <!-- MAST -->
        <line
            x1="215"
            y1="300"
            x2="215"
            y2="90"
            stroke="#555"
            stroke-width="6" />

        <!-- SAIL -->
        <path
            id="sail"
            d="
                M215 95
                L215 295
                L340 295
                Z
            "
            fill="#ffffff"
            stroke="#222"
            stroke-width="3" />

        <!-- BOOM -->
        <line
            id="boom"
            x1="215"
            y1="185"
            x2="320"
            y2="275"
            stroke="#555"
            stroke-width="8"
            stroke-linecap="round" />

        <!-- STERN -->
        <line
            x1="100"
            y1="310"
            x2="100"
            y2="330"
            stroke="#222"
            stroke-width="5"
            stroke-linecap="round" />

    </g>

    <!-- SAILOR
         BETWEEN WIND AND ILCA
         HOLDING THE ILCA'S STERN
    -->
    <g id="sailor">

        <circle
            cx="390"
            cy="265"
            r="17"
            fill="#333" />

        <line
            x1="390"
            y1="282"
            x2="390"
            y2="335"
            stroke="#333"
            stroke-width="10"
            stroke-linecap="round" />

        <!-- ARM REACHING TOWARD ILCA STERN -->
        <line
            x1="390"
            y1="295"
            x2="350"
            y2="305"
            stroke="#333"
            stroke-width="8"
            stroke-linecap="round" />

        <!-- OTHER ARM -->
        <line
            x1="390"
            y1="295"
            x2="445"
            y2="315"
            stroke="#333"
            stroke-width="8"
            stroke-linecap="round" />

        <line
            x1="390"
            y1="335"
            x2="365"
            y2="365"
            stroke="#333"
            stroke-width="9"
            stroke-linecap="round" />

        <line
            x1="390"
            y1="335"
            x2="415"
            y2="365"
            stroke="#333"
            stroke-width="9"
            stroke-linecap="round" />

        <!-- HAND ON ILCA STERN -->
        <circle
            cx="350"
            cy="305"
            r="6"
            fill="#333" />

    </g>

    <!-- WAVES -->
    <g id="waves">

        <path
            d="
                M0 390
                Q50 375 100 390
                T200 390
                T300 390
                T400 390
                T500 390
                T600 390
                T700 390
                T800 390
            "
            fill="none"
            stroke="#6bb7d6"
            stroke-width="3" />

        <path
            d="
                M0 450
                Q50 435 100 450
                T200 450
                T300 450
                T400 450
                T500 450
                T600 450
                T700 450
                T800 450
            "
            fill="none"
            stroke="#6bb7d6"
            stroke-width="3" />

    </g>

    <!-- UNIVERSAL RULE -->
    <text
        x="400"
        y="480"
        text-anchor="middle"
        font-size="20"
        font-weight="700"
        fill="#333">
        WIND → SAILOR → ILCA
    </text>

</svg>
